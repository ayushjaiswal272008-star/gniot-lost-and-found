name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "Attempting clean install with npm ci..."
            npm ci --legacy-peer-deps || {
              echo "npm ci encountered out-of-sync lockfile. Falling back to npm install..."
              npm install --legacy-peer-deps
            }
          else
            echo "package-lock.json not found, running npm install..."
            npm install --legacy-peer-deps
          fi

      - name: Build site with Vite
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || '' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || '' }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL || vars.VITE_BACKEND_URL || '' }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Push to gh-pages branch (branch-deployment fallback)
        if: success()
        run: |
          if [ -d "dist" ] && [ -f "dist/index.html" ]; then
            echo "Syncing compiled dist to gh-pages branch..."
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            cd dist
            git init
            git checkout -b gh-pages
            git add -A
            git commit -m "Deploy compiled dist to gh-pages [skip ci]" || true
            git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages || true
          else
            echo "Error: dist directory or dist/index.html missing. Aborting gh-pages branch update."
            exit 1
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
